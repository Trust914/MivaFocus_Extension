<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MivaFocus</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Onboarding Screen -->
  <div id="onboarding" class="popup-screen">
    <h2 class="title">⚡ MivaFocus Setup</h2>
    <p class="subtitle">Select your department to get started</p>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Loading departments...</p>
    </div>

    <div id="error" class="error hidden"></div>

    <div class="form-group">
      <label for="department">Department</label>
      <select id="department">
        <option value="">Select Department</option>
      </select>
    </div>

    <button id="saveSetup" class="btn primary" disabled>Save & Continue</button>
  </div>

  <!-- Settings Screen -->
  <div id="settings" class="popup-screen hidden">
    <h2 class="title">⚙️ MivaFocus Settings</h2>
    <p class="subtitle">Manage your course filter</p>

    <div id="currentSettings" class="info-box"></div>

    <div class="button-group">
      <button id="toggleGlobalFilter" class="btn secondary">Enable Filter</button>
      <button id="resetSettings" class="btn danger">Reset Settings</button>
    </div>

    <div class="tip-box">
      💡 <strong>Tip:</strong> Use the LMS filter dropdowns to adjust level and semester filters.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
